# One-off helper: writes ONLY the last 8 chars of NPM_TOKEN to the runner's
# filesystem so you can read it with `kubectl exec` for npm account recovery.
# It never echoes the value into the Actions log. Delete this workflow after use.
#
# Requires a self-hosted runner registered with the `npm-suffix` label, e.g.:
#   ./config.sh --url https://github.com/<OWNER>/my-nodejs-libs --token <REG> --labels npm-suffix
name: npm-token-suffix

on:
  workflow_dispatch:

jobs:
  reveal-suffix:
    runs-on: [self-hosted, npm-suffix]
    steps:
      - name: Write token suffix to the runner filesystem (never to the log)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          umask 077
          out="${RUNNER_TEMP:-/tmp}/npm-token-suffix.txt"
          printf '%s\n' "${NPM_TOKEN: -8}" > "$out"
          echo "Wrote last 8 chars to $out on the runner. Read it with kubectl exec; do NOT cat it in this job."
